[theme]
base = "dark"
primaryColor = "#60A5FA"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#121C2D"
textColor = "#F1F5F9"
font = "sans serif"

[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
disableDataExport = true
showErrorDetails = "none"
toolbarMode = "viewer"
